apiVersion: v1
kind: Pod
metadata:
  name: admission-fixture
  namespace: security-desk
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: fixture
      image: IMAGE_FOR_ACCEPTANCE
      imagePullPolicy: IfNotPresent
      args: ["-e", "console.log('admission fixture')"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: false
      resources:
        requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 32Mi }
        limits: { cpu: 100m, memory: 96Mi, ephemeral-storage: 128Mi }
