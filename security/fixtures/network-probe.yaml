apiVersion: v1
kind: Pod
metadata:
  name: desk-isolation
  namespace: lab-network-check
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: fixture
      image: IMAGE_FOR_ACCEPTANCE
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 32Mi }
        limits: { cpu: 100m, memory: 96Mi, ephemeral-storage: 128Mi }
      args:
        - -e
        - |
          const { lookup } = require('node:dns').promises;
          const { connect } = require('node:net');
          function connectionResult(host, port) {
            return new Promise((resolve, reject) => {
              const socket = connect({ host, port, timeout: 4000 });
              socket.once('connect', () => {
                socket.destroy();
                reject(new Error('A network-isolated service accepted TCP'));
              });
              socket.once('timeout', () => {
                socket.destroy();
                resolve('ETIMEDOUT');
              });
              socket.once('error', (error) => {
                if (['ETIMEDOUT', 'ECONNREFUSED', 'EHOSTUNREACH'].includes(error.code)) resolve(error.code);
                else reject(error);
              });
            });
          }
          async function probe() {
            for (const [service, port] of [['desk', 8080], ['desk-metrics', 9091]]) {
              const name = service + '.security-desk.svc.cluster.local';
              const { address } = await lookup(name, { family: 4 });
              console.log('%s: %s', service, await connectionResult(address, port));
            }
          }
          probe().catch((error) => {
            console.error(error);
            process.exit(1);
          });
