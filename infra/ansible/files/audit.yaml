apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
omitManagedFields: true
rules:
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*"]
  - level: None
    users: ["system:anonymous"]
    verbs: ["get"]
    nonResourceURLs: ["/version", "/api", "/apis"]
  - level: Metadata
