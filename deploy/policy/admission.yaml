apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: desk-pod-controls.lab.dev
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
        && c.securityContext.readOnlyRootFilesystem)
        && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
        && c.securityContext.readOnlyRootFilesystem))
      message: "desk-pod-controls: require a read-only container root filesystem"
    - expression: >-
        object.spec.containers.all(c, c.image.matches('^[a-z0-9][a-z0-9./:-]+@sha256:[a-f0-9]{64}$'))
        && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        c.image.matches('^[a-z0-9][a-z0-9./:-]+@sha256:[a-f0-9]{64}$')))
      message: "desk-pod-controls: require immutable SHA-256 image references"
    - expression: >-
        has(object.spec.automountServiceAccountToken)
        && !object.spec.automountServiceAccountToken
        && (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected)
        || v.projected.sources.all(s, !has(s.serviceAccountToken))))
      message: "desk-pod-controls: prevent automatic and projected API tokens"
    - expression: "!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0"
      message: "desk-pod-controls: ephemeral containers are disabled"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: desk-pod-controls
spec:
  policyName: desk-pod-controls.lab.dev
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        lab.dev/security: enforce
