deploymentMode: SingleBinary
fullnameOverride: lab-logs
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: 168h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false
  schemaConfig:
    configs:
      - from: '2025-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 3Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 750m, memory: 768Mi }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
