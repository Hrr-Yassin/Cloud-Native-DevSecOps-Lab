apiVersion: v1
kind: ResourceQuota
metadata:
  name: desk-quota
  namespace: security-desk
spec:
  hard:
    pods: "5"
    requests.cpu: "750m"
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 1536Mi
    requests.ephemeral-storage: 512Mi
    limits.ephemeral-storage: 2048Mi
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
    services: "2"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: desk-limits
  namespace: security-desk
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 32Mi
      max:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 512Mi
