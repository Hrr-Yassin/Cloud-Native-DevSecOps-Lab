apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: desk-default-deny
  namespace: security-desk
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: desk-allow-trusted-ingress
  namespace: security-desk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: desk
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 9091 }
